name: CE MIDI Lagrima reference benchmark

on:
  pull_request:
    paths:
      - '.github/workflows/ce-midi-lagrima-reference-benchmark.yml'
      - 'scripts/runLagrimaMidiReferenceBenchmark.mjs'
      - 'adapters/midi/**'
      - 'src/contracts/midiReferenceEvidence.js'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --package-lock=false
      - name: Fetch exact admitted musiclab Lagrima MIDI
        run: |
          set -euo pipefail
          mkdir -p .tmp/lagrima
          URL='https://raw.githubusercontent.com/drgolem/musiclab/553fd1e72fb6a2cfdfb00d57052e0ee868abcf0b/scores_midi/lagrima-tarrega.mid'
          curl --fail --location --connect-timeout 20 --max-time 90 --retry 3 --retry-all-errors "$URL" -o .tmp/lagrima/lagrima-tarrega.mid
          printf '%s  %s\n' '0c7dcf81b1a291bf0b445dc15b000bafc2660fa14fe93ba9a38f397b6e29d054' '.tmp/lagrima/lagrima-tarrega.mid' | sha256sum -c -
      - name: Compare pinned score opening with trusted MIDI
        run: node scripts/runLagrimaMidiReferenceBenchmark.mjs .tmp/lagrima/lagrima-tarrega.mid | tee .tmp/lagrima-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: lagrima-midi-reference-benchmark
          path: .tmp/lagrima-benchmark.json
