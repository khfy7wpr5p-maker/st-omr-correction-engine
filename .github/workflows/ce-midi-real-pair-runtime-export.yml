name: CE MIDI real-pair runtime export

on:
  push:
    branches:
      - research/ce-midi-corpus-02-real-pair-runtime

jobs:
  export-exact-midi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --package-lock=false
      - name: Fetch exact reference MIDI bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/real-pair
          curl --http1.1 --ipv4 --fail --location --connect-timeout 20 --max-time 90 --retry 3 --retry-all-errors -A 'Mozilla/5.0 CE-MIDI real-pair verifier' \
            'https://www.mutopiaproject.org/ftp/SorF/O35/sorf_op35_no13/sorf_op35_no13.mid' \
            -o .tmp/real-pair/sor.mid
          curl --fail --location --retry 3 --retry-all-errors \
            'https://raw.githubusercontent.com/fosfrancesco/asap-dataset/fad8d1e8078d0ae47ad2f280b5d022bd2de24784/Bach/Prelude/bwv_846/midi_score.mid' \
            -o .tmp/real-pair/bach.mid
          printf '%s  %s\n' '35ac900c3dd049272e670af166a443251e0a61d829a5badc17bf9cf564bcd527' '.tmp/real-pair/sor.mid' | sha256sum -c -
          printf '%s  %s\n' '3e2f8b9f3cf6c710788f1963066b04850e0335e94a9558f642fa2cd6eb3fb45f' '.tmp/real-pair/bach.mid' | sha256sum -c -
          test "$(stat -c%s .tmp/real-pair/sor.mid)" = '2862'
          test "$(stat -c%s .tmp/real-pair/bach.mid)" = '3525'
      - name: Upload runtime bundle for exact local comparison
        uses: actions/upload-artifact@v4
        with:
          name: ce-midi-real-pair-runtime-bundle
          path: |
            adapters
            src
            package.json
            package-lock.json
            node_modules
            .tmp/real-pair/*.mid
          if-no-files-found: error
          retention-days: 1
